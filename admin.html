<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>إدارة المتجر | كنافة البشوات</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin.js"></script>
</head><body class="admin-body">
<header class="site-header"><a class="brand" href="index.html"><span class="crown">♛</span><span><strong>كنافة البشوات</strong><small>إدارة المتجر</small></span></a><a class="header-order" href="index.html">عرض المتجر ↗</a></header>
<main class="admin-wrap"><section class="admin-heading"><p class="eyebrow">لوحة التحكم</p><h1>إدارة <span>المنتجات</span></h1><p>أضف المنتجات والصور، وعدّل الأسعار أو احذف المنتجات.</p></section>
<div id="notice" class="notice" role="status" hidden></div>
<section id="login-panel" class="panel login-panel"><h2>تسجيل دخول الإدارة</h2><p>هذه الصفحة للمصرّح لهم فقط.</p><form id="login-form"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="gold-button" type="submit">تسجيل الدخول</button></form></section>
<div id="dashboard" hidden>
<section class="panel"><div class="panel-title"><h2 id="form-title">إضافة منتج جديد</h2><button id="cancel-edit" class="subtle-button" type="button" hidden>إلغاء التعديل</button></div>
<form id="product-form" class="product-form"><input id="product-id" type="hidden"><label>اسم المنتج *<input id="name" required maxlength="120" placeholder="مثال: كنافة بالقشطة"></label><label>التصنيف *<input id="category" required maxlength="80" placeholder="مثال: الكنافة"></label><label>السعر *<input id="price" type="number" min="0" step="0.01" required placeholder="25"></label><label class="full-field">وصف المنتج<textarea id="description" rows="3" maxlength="1000" placeholder="اكتب وصفًا مختصرًا للمنتج"></textarea></label><label class="full-field">صورة المنتج<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>اختياري — PNG أو JPG أو WEBP، بحد أقصى 5 ميجابايت.</small><img id="image-preview" alt="معاينة الصورة" hidden></label><label class="full-field">أو رابط صورة مباشر<input id="image-url" type="url" placeholder="https://example.com/image.jpg"><small>إذا رفعت صورة من جهازك، ستُستخدم الصورة المرفوعة بدل الرابط.</small></label><div class="form-actions full-field"><button id="save-product" class="gold-button" type="submit">إضافة المنتج</button><button id="sign-out" class="subtle-button" type="button">تسجيل الخروج</button></div></form></section>
<section class="panel products-panel"><div class="panel-title"><h2>المنتجات الحالية</h2><button id="refresh-products" class="subtle-button" type="button">تحديث القائمة</button></div><div id="admin-products" class="admin-products"><p>جارٍ التحميل...</p></div></section>
</div></main><footer class="site-footer"><p>إدارة آمنة لمتجر كنافة البشوات</p></footer>
</body></html>
